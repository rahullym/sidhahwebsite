# Publishes a preview of the site to GitHub Pages on every push to main.
# This is NOT production: it builds with DEPLOY_TARGET=gh-pages, which serves
# from the /sidhahwebsite/ sub-path and marks every page noindex so it cannot
# compete with sidhah.com in search.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them and keep the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # GitHub Pages is static hosting and has no database, so the staff
      # dashboard cannot run here. Removing the routes keeps the preview a pure
      # marketing build — and guarantees no admin page is ever published to a
      # host that cannot authenticate it.
      - run: rm -rf src/pages/admin src/middleware.ts

      # `npm run build` runs astro check first, so a type error fails the deploy.
      - run: npm run build
        env:
          DEPLOY_TARGET: gh-pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
